<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>设备配网</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 380px;          /* 手机更友好的宽度 */
      overflow: hidden;
    }

    .header {
      background: #4a6cf7;
      color: white;
      padding: 20px 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 20px 16px 16px;
    }

    .info-box {
      background: #f0f4ff;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #333;
      line-height: 1.5;
    }

    .info-box strong {
      color: #4a6cf7;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      height: 46px;               /* 更大的点击区域，适合手机 */
      padding: 0 14px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }

    .form-group input:focus {
      border-color: #4a6cf7;
    }

    /* 密码框 + 显示密码按钮 */
    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 70px;
    }

    .toggle-pwd {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #4a6cf7;
      font-size: 13px;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 6px;
    }

    .toggle-pwd:active {
      background: #f0f4ff;
    }

    .btn {
      width: 100%;
      height: 48px;               /* 手机友好的按钮高度 */
      background: #4a6cf7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn:active {
      background: #3b5bdb;
    }

    .btn:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .status.success {
      background: #e6fffa;
      color: #234e52;
      display: block;
    }

    .status.error {
      background: #fff5f5;
      color: #c53030;
      display: block;
    }

    .status.loading {
      background: #ebf8ff;
      color: #2b6cb0;
      display: block;
    }

    .footer {
      text-align: center;
      padding: 12px 16px 16px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>LTF_exe设备配网</h1>
      <p>尝试开启新生活</p>
    </div>

    <div class="content">
      <div class="info-box">
        当前设备热点：<strong>LTF_exe</strong><br>
        请输入您的家庭 WiFi 名称和密码
      </div>

      <form id="configForm">
        <!-- SSID 输入框 -->
        <div class="form-group">
          <label for="ssid">WiFi 名称 (SSID)</label>
          <input type="text" id="ssid" placeholder="请输入 WiFi 名称" maxlength="32" autocomplete="off">
        </div>

        <!-- 密码输入框 + 显示密码 -->
        <div class="form-group">
          <label for="password">WiFi 密码</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="请输入密码" maxlength="64" autocomplete="off">
            <button type="button" class="toggle-pwd" id="togglePwd">显示</button>
          </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">开始配网</button>
      </form>

      <div class="status" id="status"></div>
    </div>

    <div class="footer">
      LTF_exe探索版
    </div>
  </div>

  <script>
    const ssidInput = document.getElementById('ssid');
    const passwordInput = document.getElementById('password');
    const togglePwd = document.getElementById('togglePwd');
    const form = document.getElementById('configForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    // 轮询控制变量
    let pollTimer = null;
    const POLL_INTERVAL = 2000; // 轮询间隔：2秒

    // 显示 / 隐藏密码
    togglePwd.addEventListener('click', function () {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        this.textContent = '隐藏';
      } else {
        passwordInput.type = 'password';
        this.textContent = '显示';
      }
    });

    // ****************** 轮询配网状态逻辑 *******************

    /**
     * 1. 轮询向 AP_get_uri 获取配网状态
     */
    function pollWifiStatus() {
      // 替换为你的 AP_get_uri 实际路由路径，例如 '/api/wifi-status'
      fetch('/wifi_status', { cache: 'no-cache' })
        .then(res => {
          if (!res.ok) {
            throw new Error('HTTP status ' + res.status);
          }
          return res.json();
        })
        .then(data => {
          parseAppStatus(data);
        })
        .catch(err => {
          console.error("获取配网状态失败:", err);
          // 注意：配网成功切断 AP 时可能会引发网络错误，这里可根据需要保持轮询或提示
          if (pollTimer) {
            pollTimer = setTimeout(pollWifiStatus, POLL_INTERVAL);
          }
        });
    }

    /**
     * 2. 解析 AP_get_uri 返回的 status 并更新UI
     */
    function parseAppStatus(data) {
      if (!data || !data.status) {
        return;
      }

      const status = data.status;

      switch (status) {
        case 'connecting':
          showStatus('正在尝试连接 WiFi，请稍候...', 'loading');
          // 继续轮询
          pollTimer = setTimeout(pollWifiStatus, POLL_INTERVAL);
          break;

        case 'success':
        case 'got_ip':
          showStatus(`配网成功！设备已获取 IP ${data.ip ? '(' + data.ip + ')' : ''} 开启智能管家`, 'success');
          stopPolling();
          submitBtn.disabled = false;
          break;

        case 'failed':
        case 'password_error':
          showStatus('配网失败：密码错误或未查找到 SSID，请重试', 'error');
          stopPolling();
          submitBtn.disabled = false;
          break;

        default:
          // 其他未知状态继续轮询
          pollTimer = setTimeout(pollWifiStatus, POLL_INTERVAL);
          break;
      }
    }

    /**
     * 停止轮询
     */
    function stopPolling() {
      if (pollTimer) {
        clearTimeout(pollTimer);
        pollTimer = null;
      }
    }

    // ****************** 提交表格并启动配网 *******************

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const ssid = ssidInput.value.trim();
      const password = passwordInput.value;

      if (!ssid) {
        showStatus('请输入 WiFi 名称', 'error');
        return;
      }

      // 禁用按钮，显示加载状态
      submitBtn.disabled = true;
      showStatus('正在发送配置信息...', 'loading');

      // 清除旧的定时器
      stopPolling();

      // 发送配网信息 POST 请求
      fetch('/wifi', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ssid, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          showStatus('信息已发送，正在等待设备连接结果...', 'loading');
          // 提交成功后，启动轮询获取最终状态
          pollWifiStatus();
        } else {
          showStatus(data.message || '配置信息发送失败', 'error');
          submitBtn.disabled = false;
        }
      })
      .catch(() => {
        showStatus('网络请求发送失败，请检查是否已连接设备热点', 'error');
        submitBtn.disabled = false;
      });
    });

    // ****************** End *******************

    // 显示信息框辅助函数
    function showStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + type;
    }
  </script>
</body>
</html>
