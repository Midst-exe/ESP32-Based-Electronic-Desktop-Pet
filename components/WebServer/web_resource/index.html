<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>LTF_exe设备配网</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(135deg, #0d1735 0%, #172653 45%, #29184b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 390px;
      background: rgba(255, 255, 255, .97);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0, 0, 0, .38), 0 0 50px rgba(80, 110, 255, .16);
      animation: cardIn .7s cubic-bezier(.2, .8, .2, 1);
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(35px) scale(.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .header {
      position: relative;
      background: linear-gradient(135deg, #4268f5, #6556e8, #824bd1);
      color: #fff;
      padding: 25px 18px 23px;
      text-align: center;
      overflow: hidden;
    }

    .header:before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .11);
      right: -75px;
      top: -115px;
      animation: headerFloat 6s ease-in-out infinite alternate;
    }

    .header:after {
      content: "";
      position: absolute;
      width: 110px;
      height: 110px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 50%;
      left: -50px;
      bottom: -70px;
      animation: ringRotate 8s linear infinite;
    }

    @keyframes headerFloat {
      from { transform: translate(0, 0); }
      to { transform: translate(-30px, 30px) scale(1.15); }
    }

    @keyframes ringRotate {
      from { transform: rotate(0) scale(1); }
      to { transform: rotate(360deg) scale(1.2); }
    }

    .header-content {
      position: relative;
      z-index: 2;
    }

    .device-indicator {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .13);
      border: 1px solid rgba(255, 255, 255, .16);
      font-size: 11px;
      margin-bottom: 9px;
      backdrop-filter: blur(5px);
    }

    /* 状态指示灯样式与动画 */
    .indicator-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      transition: background-color .3s;
    }

    .indicator-dot.standby {
      background: #ffc107;
      animation: pulseYellow 2s infinite;
    }

    .indicator-dot.connecting {
      background: #00d2ff;
      animation: pulseBlue .8s infinite;
    }

    .indicator-dot.success {
      background: #78ffae;
      box-shadow: 0 0 6px #78ffae;
    }

    .indicator-dot.error {
      background: #ff5252;
      animation: pulseRed .6s infinite;
    }

    @keyframes pulseYellow {
      0% { box-shadow: 0 0 0 0 rgba(255, 193, 7, .7); }
      70% { box-shadow: 0 0 0 8px rgba(255, 193, 7, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0); }
    }

    @keyframes pulseBlue {
      0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, .8); }
      70% { box-shadow: 0 0 0 8px rgba(0, 210, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); }
    }

    @keyframes pulseRed {
      0% { box-shadow: 0 0 0 0 rgba(255, 82, 82, .8); }
      70% { box-shadow: 0 0 0 8px rgba(255, 82, 82, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0); }
    }

    .header h1 {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: .5px;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .2);
    }

    .header p {
      font-size: 12px;
      opacity: .9;
      letter-spacing: 1px;
    }

    .content {
      padding: 22px 18px 18px;
    }

    .info-box {
      position: relative;
      background: linear-gradient(135deg, #f0f4ff, #f8f2ff);
      border-radius: 12px;
      padding: 14px 15px;
      margin-bottom: 22px;
      font-size: 13px;
      color: #444;
      line-height: 1.65;
      border: 1px solid rgba(74, 108, 247, .08);
      overflow: hidden;
    }

    .info-box:before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, #4a6cf7, #8755e8);
      border-radius: 4px;
    }

    .info-box strong {
      color: #4a6cf7;
      font-weight: 650;
    }

    .form-group {
      margin-bottom: 17px;
      animation: formIn .5s ease backwards;
    }

    .form-group:nth-child(1) { animation-delay: .15s; }
    .form-group:nth-child(2) { animation-delay: .25s; }

    @keyframes formIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 7px;
      font-weight: 550;
    }

    .form-group input {
      width: 100%;
      height: 47px;
      padding: 0 14px;
      border: 1px solid #dfe3ec;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: #fff;
      color: #333;
      transition: border-color .25s, box-shadow .25s, transform .2s;
    }

    .form-group input::placeholder {
      color: #b2b6c0;
    }

    .form-group input:focus {
      border-color: #4a6cf7;
      box-shadow: 0 0 0 3px rgba(74, 108, 247, .1), 0 5px 15px rgba(74, 108, 247, .08);
      transform: translateY(-1px);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 72px;
    }

    .toggle-pwd {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: #4a6cf7;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 7px;
      transition: .2s;
    }

    .toggle-pwd:hover {
      background: #f0f4ff;
    }

    .toggle-pwd:active {
      transform: translateY(-50%) scale(.92);
    }

    /* 呼吸灯背光按钮 */
    .btn {
      position: relative;
      width: 100%;
      height: 49px;
      margin-top: 7px;
      background: linear-gradient(135deg, #4a6cf7, #6758f5);
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      overflow: visible;
      transition: .2s;
      animation: btnGlow 3s ease-in-out infinite;
    }

    @keyframes btnGlow {
      0%, 100% {
        box-shadow: 0 5px 15px rgba(74, 108, 247, .3), 0 0 10px rgba(103, 88, 245, .2);
      }
      50% {
        box-shadow: 0 8px 25px rgba(74, 108, 247, .6), 0 0 22px rgba(103, 88, 245, .6);
      }
    }

    .btn:before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 70%;
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .3), transparent);
      transform: skewX(-20deg);
      animation: shine 3.5s infinite;
      pointer-events: none;
    }

    @keyframes shine {
      0% { left: -100%; }
      35% { left: 130%; }
      100% { left: 130%; }
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px) scale(.99);
    }

    .btn:disabled {
      background: linear-gradient(135deg, #9ea8ba, #8f9bad);
      box-shadow: none;
      cursor: not-allowed;
      animation: none;
    }

    .status {
      margin-top: 17px;
      padding: 13px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      display: none;
      animation: statusIn .3s ease;
    }

    @keyframes statusIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .status.success {
      background: #e9fff8;
      color: #246158;
      border: 1px solid #c9f5e9;
      display: block;
    }

    .status.error {
      background: #fff4f4;
      color: #c53030;
      border: 1px solid #ffdada;
      display: block;
    }

    .status.loading {
      background: #edf7ff;
      color: #2b6cb0;
      border: 1px solid #d8edff;
      display: block;
      animation: statusIn .3s ease, loadingPulse 2s ease-in-out infinite;
    }

    @keyframes loadingPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .65; }
    }

    .footer {
      text-align: center;
      padding: 13px 16px 18px;
      font-size: 11px;
      color: #a5a9b3;
      letter-spacing: .5px;
    }

    @media (max-width: 420px) {
      body { padding: 14px; }
      .container { border-radius: 20px; }
      .header { padding: 23px 16px 21px; }
      .content { padding: 20px 16px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header">
      <div class="header-content">
        <div class="device-indicator">
          <span class="indicator-dot standby" id="indicatorDot"></span>
          <span id="indicatorText">待配网</span>
        </div>
        <h1>LTF_exe设备配网</h1>
        <p>尝试开启新生活</p>
      </div>
    </div>

    <div class="content">
      <div class="info-box">
        当前设备热点：<strong>LTF_exe</strong><br>
        请输入您的家庭 WiFi 名称和密码
      </div>

      <form id="configForm">
        <div class="form-group">
          <label for="ssid">WiFi 名称 (SSID)</label>
          <input type="text" id="ssid" placeholder="请输入 WiFi 名称" maxlength="32" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="password">WiFi 密码</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="请输入密码" maxlength="64" autocomplete="off">
            <button type="button" class="toggle-pwd" id="togglePwd">显示</button>
          </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">开始配网</button>
      </form>

      <div class="status" id="status"></div>
    </div>

    <div class="footer">LTF_exe探索版</div>
  </div>

  <script>
    /* =========================================================
       指示灯 UI 状态更新辅助函数
       ========================================================= */

    const indicatorDot = document.getElementById('indicatorDot');
    const indicatorText = document.getElementById('indicatorText');

    function updateIndicator(state, text) {
      if (indicatorDot && indicatorText) {
        indicatorDot.className = 'indicator-dot ' + state;
        indicatorText.textContent = text;
      }
    }


    /* =========================================================
       WiFi 配网逻辑
       ========================================================= */

    const ssidInput = document.getElementById('ssid');
    const passwordInput = document.getElementById('password');
    const togglePwd = document.getElementById('togglePwd');
    const form = document.getElementById('configForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    let pollTimer = null;
    const POLL_INTERVAL = 5000;

    /* 显示 / 隐藏密码 */
    togglePwd.addEventListener('click', function() {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        this.textContent = '隐藏';
      } else {
        passwordInput.type = 'password';
        this.textContent = '显示';
      }
    });

    /* 查询 WiFi 状态 */
    function pollWifiStatus() {
      fetch('/wifi_status', {
        cache: 'no-cache'
      })
      .then(res => {
        if (!res.ok) {
          throw new Error('HTTP status ' + res.status);
        }
        return res.json();
      })
      .then(data => {
        parseAppStatus(data);
      })
      .catch(err => {
        console.error("获取配网状态失败:", err);
        if (pollTimer) {
          pollTimer = setTimeout(pollWifiStatus, POLL_INTERVAL);
        }
      });
    }

    /* 解析 WiFi 状态 */
    function parseAppStatus(data) {
      if (!data || !data.status) return;

      const status = data.status;

      switch (status) {
        case 'connecting':
          updateIndicator('connecting', '正在连接...');
          showStatus('正在尝试连接 WiFi，请稍候...', 'loading');
          pollTimer = setTimeout(pollWifiStatus, POLL_INTERVAL);
          break;

      //   case 'success':
      // 修改为 当拿到 IP 时才算成功，去掉 success 状态，避免误判
        case 'got_ip':
          updateIndicator('success', '已连接网络');
          showStatus(`配网成功！设备已获取 IP ${data.ip ? '(' + data.ip + ')' : ''}`, 'success');
          stopPolling();
          submitBtn.disabled = false;
          break;

        case 'failed':
          updateIndicator('error', '连接失败');
          showStatus('配网失败：密码错误或未查找到 SSID，请重试', 'error');
          stopPolling();
          submitBtn.disabled = false;
          break;

        default:
          pollTimer = setTimeout(pollWifiStatus, POLL_INTERVAL);
          break;
      }
    }

    /* 停止轮询 */
    function stopPolling() {
      if (pollTimer) {
        clearTimeout(pollTimer);
        pollTimer = null;
      }
    }

    /* 提交 WiFi 配置 */
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const ssid = ssidInput.value.trim();
      const password = passwordInput.value;

      /* SSID 不能为空 */
      if (!ssid) {
        showStatus('请输入 WiFi 名称', 'error');
        return;
      }

      /* 禁用按钮 */
      submitBtn.disabled = true;

      /* 更新指示灯与状态 */
      updateIndicator('connecting', '发送配置中...');
      showStatus('正在发送配置信息...', 'loading');

      /* 停止之前的轮询 */
      stopPolling();

      /* 发送 WiFi 配置 */
      fetch('/wifi', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          ssid,
          password
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          showStatus('信息已发送，正在等待设备连接结果...', 'loading');
          pollWifiStatus();
        } else {
          updateIndicator('error', '发送失败');
          showStatus(data.message || '配置信息发送失败', 'error');
          submitBtn.disabled = false;
        }
      })
      .catch(() => {
        updateIndicator('error', '请求超时');
        showStatus('网络请求发送失败，请检查是否已连接设备热点', 'error');
        submitBtn.disabled = false;
      });
    });

    /* 显示状态 */
    function showStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + type;
    }
  </script>

</body>
</html>
